{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - MurtiKart</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --metallic-gold: #d4af37;
            --deep-maroon: #1a0505;
            --glass-bg: rgba(255, 255, 255, 0.03);
        }

        body {
            background: var(--deep-maroon);
            background: radial-gradient(circle at center, #2c0e0e 0%, #1a0505 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
        }

        .reset-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            text-align: center;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: white !important;
            padding: 12px 20px;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3) !important;
            border-color: var(--metallic-gold) !important;
            outline: none;
        }

        .btn-gold {
            background: var(--metallic-gold);
            border: none;
            color: #1a0505;
            font-weight: 700;
            border-radius: 12px;
            padding: 14px;
            width: 100%;
            margin-top: 10px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-gold:hover {
            background: #f5e6c8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }

        .label-gold {
            color: var(--metallic-gold);
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 8px;
            display: block;
            text-align: left;
        }

        .back-link {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
            display: inline-block;
            margin-top: 20px;
        }

        .back-link:hover {
            color: var(--metallic-gold);
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 0.8rem;
            text-align: left;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="reset-card">
        <div class="mb-4">
            <h2 class="display-6 fw-bold text-white mb-1" style="font-family: 'Playfair Display', serif;">MurtiKart</h2>
            <div style="height: 2px; width: 50px; background: var(--metallic-gold); margin: 0 auto;"></div>
        </div>
        
        <h4 class="fw-bold mb-3">Forgot Password?</h4>
        <p class="text-white-50 mb-4 small">Don't worry! Enter your email address below and we'll send you a password change link.</p>

        <form method="post">
            {% csrf_token %}
            
            <div class="mb-4">
                <label for="id_email" class="label-gold">Email Address</label>
                <input type="email" name="email" id="id_email" class="form-control" 
                       placeholder="example@murtikart.com" autocomplete="email" required>
                
                {% if form.email.errors %}
                    {% for error in form.email.errors %}
                        <div class="error-msg"><i class="fa-solid fa-circle-exclamation me-1"></i> {{ error }}</div>
                    {% endfor %}
                {% endif %}
            </div>

            <button type="submit" class="btn btn-gold">
                Send Reset Link
            </button>

            <div>
                <a href="{% url 'auth:login' %}" class="back-link">
                    <i class="fa-solid fa-arrow-left me-1"></i> Back to Login
                </a>
            </div>
        </form>
    </div>

</body>
</html>
