{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Changed - MurtiKart</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --metallic-gold: #d4af37;
            --deep-maroon: #1a0505;
            --success-green: #28a745;
        }

        body {
            background: var(--deep-maroon);
            background: radial-gradient(circle at center, #2c0e0e 0%, #1a0505 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
        }

        .complete-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 50px 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            text-align: center;
        }

        .check-icon {
            width: 85px;
            height: 85px;
            background: rgba(40, 167, 69, 0.1);
            border: 2px solid var(--success-green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            color: var(--success-green);
            font-size: 2.5rem;
            box-shadow: 0 0 20px rgba(40, 167, 69, 0.2);
        }

        .btn-login {
            background: var(--metallic-gold);
            border: none;
            color: #1a0505;
            font-weight: 700;
            border-radius: 12px;
            padding: 14px 40px;
            width: 100%;
            margin-top: 10px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            display: inline-block;
        }

        .btn-login:hover {
            background: #f5e6c8;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3);
            color: #1a0505;
        }
    </style>
</head>
<body>

    <div class="complete-card">
        <div class="check-icon">
            <i class="fa-solid fa-circle-check"></i>
        </div>
        
        <h2 class="fw-bold mb-3" style="font-family: 'Playfair Display', serif;">Password Updated!</h2>
        
        <p class="text-white-50 mb-5">
            Your password has been successfully changed. Now you can login to MurtiKart dashboard with your new password.
        </p>

        <a href="{% url 'auth:login' %}" class="btn btn-login">
            Login Now
        </a>

        <div class="mt-4 pt-3 border-top border-secondary opacity-50">
            <p class="x-small mb-0 text-muted">Security Tip: Do not share your password with anyone.</p>
        </div>
    </div>

</body>
</html>
