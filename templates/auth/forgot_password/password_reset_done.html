{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sent - MurtiKart</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --metallic-gold: #d4af37;
            --deep-maroon: #1a0505;
        }

        body {
            background: var(--deep-maroon);
            background: radial-gradient(circle at center, #2c0e0e 0%, #1a0505 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
        }

        .success-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 50px 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            text-align: center;
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: rgba(212, 175, 55, 0.1);
            border: 2px solid var(--metallic-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            color: var(--metallic-gold);
            font-size: 2rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(212, 175, 55, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }

        .btn-outline-gold {
            border: 1px solid var(--metallic-gold);
            color: var(--metallic-gold);
            font-weight: 600;
            border-radius: 12px;
            padding: 12px 30px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }

        .btn-outline-gold:hover {
            background: var(--metallic-gold);
            color: #1a0505;
        }
    </style>
</head>
<body>

    <div class="success-card">
        <div class="icon-box">
            <i class="fa-solid fa-paper-plane"></i>
        </div>
        
        <h2 class="fw-bold mb-3" style="font-family: 'Playfair Display', serif;">Check Your Email</h2>
        
        <p class="text-white-50 mb-4">
            We have sent you a link to change your password. If you did not receive the email, please yours <strong>Spam</strong> Check the folder.
        </p>

        <div class="p-3 mb-4 rounded" style="background: rgba(255,255,255,0.05); border-left: 4px solid var(--metallic-gold);">
            <p class="small mb-0 text-start">
                <i class="fa-solid fa-circle-info me-2 text-warning"></i>
                If there is no account on this email id, you will not receive the email.
            </p>
        </div>

        <a href="{% url 'auth:login' %}" class="btn btn-outline-gold">
            Back to Login
        </a>
    </div>

</body>
</html>
